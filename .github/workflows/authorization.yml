name: Authorization Permission Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# ให้สิทธิ์เท่าที่จำเป็น
permissions:
  contents: read

jobs:
  permission-check:
    name: Verify Repository Access
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify repository context
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"

          test -d .git
          echo "Repository checkout: PASS"

      - name: Verify workflow permissions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            "repos/${GITHUB_REPOSITORY}" \
            --jq '{full_name: .full_name, private: .private}'

          echo "Repository API access: PASS"

